# Terminologie-Layer (Deutsch) — Single Source of Truth für Anzeige-Labels.
#
# Die ENGINE bleibt sprachneutral/englisch: Objekttypen, Kantennamen und Status-Werte
# (die Schlüssel links) sind stabile interne Tokens — sie stehen so im Schema, in den
# 697 Objekten, in Skills und im Validator. Hier wird NUR die DARSTELLUNG lokalisiert.
#
# Verwendung: der Cockpit-Generator (und künftige Views/Skill-Ausgaben) schlagen Labels
# hier nach statt sie inline zu verdrahten. Fehlt ein Schlüssel, wird der Token
# humanisiert (Unterstriche → Leerzeichen) — nichts bricht.
#
# Weitere Sprache = weitere Datei terms.<lang>.yaml mit denselben Schlüsseln.

