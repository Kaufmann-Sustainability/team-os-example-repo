# ESRS-Offenlegungs-KONZEPTE — stabile, versionsunabhängige Anker (Standard S1).
#
# Warum: DR-Nummern verschieben sich zwischen Regulierungs-Fassungen (ESRS 2023 final
# vs. EC-Entwurf 2026). Inhalt (Targets/Policies/Actions) wird NICHT an eine DR-Nummer
# gebunden, sondern an ein Konzept hier. Jede Katalog-Version bildet ihre DR-Codes auf
# diese Konzepte ab (Feld `concept:` im Katalog). So gilt EIN Mapping für ALLE Versionen.
#
# Spalten = wie die jeweilige Fassung dieses Konzept nummeriert (rein informativ /
# Gegenprobe; maßgeblich ist `concept:` im jeweiligen Katalog). Für S1 sind 2023 und
# EC-Entwurf weitgehend deckungsgleich nummeriert (S1-1 … S1-17).
standard: S1
konzepte:
  - id: policies-workforce
    name: "Policies zur eigenen Belegschaft"
    nummerierung: {esrs-2023: S1-1, ec-draft-2026: S1-1}
  - id: engagement-workforce
    name: "Prozesse zur Einbindung der Beschäftigten"
    nummerierung: {esrs-2023: S1-2, ec-draft-2026: S1-2}
  - id: remediation-channels
    name: "Beschwerde- & Abhilfekanäle"
    nummerierung: {esrs-2023: S1-3, ec-draft-2026: S1-3}
  - id: actions-workforce
    name: "Maßnahmen zu wesentlichen Auswirkungen"
    nummerierung: {esrs-2023: S1-4, ec-draft-2026: S1-4}
  - id: targets-workforce
    name: "Ziele zur eigenen Belegschaft"
    nummerierung: {esrs-2023: S1-5, ec-draft-2026: S1-5}
  - id: employee-characteristics
    name: "Merkmale der Beschäftigten"
    nummerierung: {esrs-2023: S1-6, ec-draft-2026: S1-6}
  - id: nonemployee-characteristics
    name: "Merkmale der Nicht-Beschäftigten"
    nummerierung: {esrs-2023: S1-7, ec-draft-2026: S1-7}
  - id: collective-bargaining
    name: "Tarifbindung & sozialer Dialog"
    nummerierung: {esrs-2023: S1-8, ec-draft-2026: S1-8}
  - id: diversity
    name: "Diversitätskennzahlen"
    nummerierung: {esrs-2023: S1-9, ec-draft-2026: S1-9}
  - id: adequate-wages
    name: "Angemessene Entlohnung"
    nummerierung: {esrs-2023: S1-10, ec-draft-2026: S1-10}
  - id: social-protection
    name: "Sozialschutz"
    nummerierung: {esrs-2023: S1-11, ec-draft-2026: S1-11}
  - id: persons-disabilities
    name: "Menschen mit Behinderung"
    nummerierung: {esrs-2023: S1-12, ec-draft-2026: S1-12}
  - id: training-development
    name: "Aus- & Weiterbildung"
    nummerierung: {esrs-2023: S1-13, ec-draft-2026: S1-13}
  - id: health-safety
    name: "Gesundheit & Sicherheit"
    nummerierung: {esrs-2023: S1-14, ec-draft-2026: S1-14}
  - id: work-life-balance
    name: "Work-Life-Balance"
    nummerierung: {esrs-2023: S1-15, ec-draft-2026: S1-15}
  - id: remuneration
    name: "Vergütung / Pay-Gap"
    nummerierung: {esrs-2023: S1-16, ec-draft-2026: S1-16}
  - id: incidents
    name: "Vorfälle, Beschwerden & schwere Menschenrechtsverletzungen"
    nummerierung: {esrs-2023: S1-17, ec-draft-2026: S1-17}

# Tier-1-Ableitungsregeln (deterministisch, KEIN LLM): Objekt-TYP -> Konzept, sofern das
# Objekt topologisch die S1-Domäne erreicht. type ist nummerierungs-unabhängig und vom
# Menschen gesetzt -> nicht halluzinierbar. KPIs & narrative DRs werden bewusst NICHT
# abgeleitet (zu semantisch -> bleiben menschlich/OFFEN).
ableitung:
  - {typ: policy,     feld: concerns,  praefix: topic-s1,  konzept: policies-workforce}
  - {typ: target,     feld: addresses, praefix: iro-s1,    konzept: targets-workforce}
  - {typ: initiative, feld: supports,  praefix: target-s1, konzept: actions-workforce}
