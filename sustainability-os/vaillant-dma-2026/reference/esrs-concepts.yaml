# ESRS-Offenlegungs-KONZEPTE — stabile, versionsunabhängige Anker.
#
# Warum: DR-Nummern verschieben sich zwischen Regulierungs-Fassungen (ESRS 2023 final
# vs. EC-Entwurf 2026). Inhalt (Targets/Policies/Actions) wird NICHT an eine DR-Nummer
# gebunden, sondern an ein Konzept hier. Jede Katalog-Version bildet ihre DR-Codes auf
# diese Konzepte ab (Feld `concept:` im Katalog). So gilt EIN Mapping für ALLE Versionen.
#
# Spalten = wie die jeweilige Fassung dieses Konzept nummeriert (rein informativ /
# Gegenprobe; maßgeblich ist `concept:` im jeweiligen Katalog).
standard: E1
konzepte:
  - id: transition-plan
    name: "Transitionsplan Klimaschutz"
    nummerierung: {esrs-2023: E1-1, ec-draft-2026: E1-1}
  - id: climate-risks
    name: "Klimabezogene Risiken & Szenarioanalyse"
    nummerierung: {esrs-2023: null, ec-draft-2026: E1-2}   # im Entwurf als eigener DR herausgelöst
  - id: resilience
    name: "Resilienz ggü. Klimawandel"
    nummerierung: {esrs-2023: null, ec-draft-2026: E1-3}   # im Entwurf neu als eigener DR
  - id: policies-climate
    name: "Klimaschutz-Policies"
    nummerierung: {esrs-2023: E1-2, ec-draft-2026: E1-4}
  - id: actions-climate
    name: "Maßnahmen & Ressourcen"
    nummerierung: {esrs-2023: E1-3, ec-draft-2026: E1-5}
  - id: targets-climate
    name: "Klimaziele"
    nummerierung: {esrs-2023: E1-4, ec-draft-2026: E1-6}
  - id: energy
    name: "Energieverbrauch & -mix"
    nummerierung: {esrs-2023: E1-5, ec-draft-2026: E1-7}
  - id: gross-ghg
    name: "Brutto-THG-Emissionen (Scope 1/2/3)"
    nummerierung: {esrs-2023: E1-6, ec-draft-2026: E1-8}
  - id: removals-credits
    name: "THG-Entnahmen & Carbon Credits"
    nummerierung: {esrs-2023: E1-7, ec-draft-2026: E1-9}
  - id: internal-carbon-price
    name: "Interne CO2-Bepreisung"
    nummerierung: {esrs-2023: E1-8, ec-draft-2026: E1-10}
  - id: financial-effects
    name: "Erwartete finanzielle Effekte"
    nummerierung: {esrs-2023: E1-9, ec-draft-2026: E1-11}

# Tier-1-Ableitungsregeln (deterministisch, KEIN LLM): Objekt-TYP -> Konzept, sofern das
# Objekt topologisch die E1-Domäne erreicht. type ist nummerierungs-unabhängig und vom
# Menschen gesetzt -> nicht halluzinierbar. KPIs & narrative DRs werden bewusst NICHT
# abgeleitet (zu semantisch -> bleiben menschlich/OFFEN).
ableitung:
  - {typ: policy,     konzept: policies-climate, gate: "concerns -> topic-e1-*"}
  - {typ: target,     konzept: targets-climate,  gate: "addresses -> iro-e1-*"}
  - {typ: initiative, konzept: actions-climate,  gate: "supports  -> target-e1-*"}
