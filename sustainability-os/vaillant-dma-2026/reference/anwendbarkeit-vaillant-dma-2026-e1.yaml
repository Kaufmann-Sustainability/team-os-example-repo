# Anwendbarkeit ESRS E1 — KUNDENSPEZIFISCH (Output des DMA->Datenpunkt-Schritts).
# Filtert den geteilten Katalog auf die für diesen Kunden wesentlichen Offenlegungen.
# VERSIONSUNABHÄNGIG: referenziert stabile KONZEPTE (reference/esrs-concepts.yaml),
# nicht DR-Nummern — gilt damit für jede Katalog-Fassung (2023, ec-draft-2026, …).
# Ausschlüsse tragen eine Begründung (prüfungsrelevant — Auditoren fechten Ausschlüsse an).
standard: E1
kunde: vaillant-dma-2026
anwendbar:
  - {konzept: transition-plan,       grund: "Klimaschutz wesentlich -> Transitionsplan verpflichtend"}
  - {konzept: climate-risks,         grund: "Wesentliche klimabezogene Risiken identifiziert"}
  - {konzept: resilience,            grund: "Resilienz-Offenlegung folgt aus climate-risks"}
  - {konzept: policies-climate,      grund: "Policy zu Klimaschutz/Anpassung wesentlich"}
  - {konzept: actions-climate,       grund: "Maßnahmen/Ressourcen wesentlich"}
  - {konzept: targets-climate,       grund: "THG-Reduktionsziele gesetzt"}
  - {konzept: energy,                grund: "Energieverbrauch wesentlich (topic-e1-energie)"}
  - {konzept: gross-ghg,             grund: "Brutto-THG-Emissionen wesentlich"}
  - {konzept: removals-credits,      grund: "Removals/Carbon-Credits genutzt"}
  - {konzept: financial-effects,     grund: "Wesentliche physische & transitorische Risiken -> finanzielle Effekte"}
nicht_anwendbar:
  - {konzept: internal-carbon-price, grund: "Kein internes CO2-Bepreisungsschema im Einsatz (¶37 bedingt anwendbar)"}
