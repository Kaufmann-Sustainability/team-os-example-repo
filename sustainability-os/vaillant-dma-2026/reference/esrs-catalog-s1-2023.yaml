# ESRS S1 — FASSUNG 2023 (final, Delegierte VO 2023/2772). Finale DR-Nummerierung.
# Kompakt gehalten (repräsentative Datenpunkte je DR) — dient der Versions-Demo.
# Maßgeblich für die Zuordnung ist `concept:` je DR (stabiler Anker, s. esrs-concepts-s1.yaml).
standard: S1
katalog_version: esrs-2023
quelle: "ESRS S1, Delegierte Verordnung (EU) 2023/2772"
disclosure_requirements: 17
drs:
  - dr_code: S1-1
    dr_name: "Policies related to own workforce"
    concept: policies-workforce
    datenpunkte:
      - {verweis: "S1-1 ¶19", datentyp: narrativ, text: "Das Unternehmen legt die Konzepte (Policies) zur Steuerung seiner wesentlichen Auswirkungen, Risiken und Chancen in Bezug auf die eigene Belegschaft offen."}
      - {verweis: "S1-1 ¶20", datentyp: narrativ, text: "Angabe, ob und wie die Policies Menschenhandel, Zwangsarbeit, Kinderarbeit sowie Diskriminierung und Vielfalt am Arbeitsplatz adressieren."}
  - dr_code: S1-2
    dr_name: "Processes for engaging with own workers and workers' representatives about impacts"
    concept: engagement-workforce
    datenpunkte:
      - {verweis: "S1-2 ¶27", datentyp: narrativ, text: "Beschreibung der Prozesse zur Einbindung der eigenen Beschäftigten und ihrer Vertretungen zu wesentlichen Auswirkungen."}
  - dr_code: S1-3
    dr_name: "Processes to remediate negative impacts and channels for own workers to raise concerns"
    concept: remediation-channels
    datenpunkte:
      - {verweis: "S1-3 ¶32", datentyp: narrativ, text: "Beschreibung der Prozesse zur Behebung negativer Auswirkungen sowie der Beschwerde-/Abhilfekanäle für die eigene Belegschaft."}
  - dr_code: S1-4
    dr_name: "Taking action on material impacts, and approaches to managing material risks and opportunities"
    concept: actions-workforce
    datenpunkte:
      - {verweis: "S1-4 ¶38", datentyp: narrativ, text: "Das Unternehmen legt die Maßnahmen zu wesentlichen Auswirkungen auf die eigene Belegschaft sowie die zugewiesenen Ressourcen offen (Verweis ESRS 2 MDR-A)."}
      - {verweis: "S1-4 ¶39", datentyp: narrativ, text: "Beschreibung des Ansatzes zur Steuerung wesentlicher Risiken und zur Nutzung wesentlicher Chancen im Zusammenhang mit der Belegschaft."}
  - dr_code: S1-5
    dr_name: "Targets related to managing material negative impacts, advancing positive impacts, and managing material risks and opportunities"
    concept: targets-workforce
    datenpunkte:
      - {verweis: "S1-5 ¶46", datentyp: narrativ, text: "Das Unternehmen legt die im Zusammenhang mit der eigenen Belegschaft gesetzten Ziele offen (Verweis ESRS 2 MDR-T)."}
      - {verweis: "S1-5 ¶47", datentyp: quantitativ, text: "Messbare, ergebnisorientierte Zielwerte mit Zieljahr und Basisjahr je wesentlichem Belegschaftsthema."}
  - dr_code: S1-6
    dr_name: "Characteristics of the undertaking's employees"
    concept: employee-characteristics
    datenpunkte:
      - {verweis: "S1-6 ¶50", datentyp: quantitativ, text: "Gesamtzahl der Beschäftigten nach Geschlecht und Land, aufgeschlüsselt nach Vertragsart (unbefristet/befristet, Voll-/Teilzeit)."}
      - {verweis: "S1-6 ¶50(c)", datentyp: quantitativ, text: "Fluktuationsrate der Beschäftigten im Berichtszeitraum."}
  - dr_code: S1-7
    dr_name: "Characteristics of non-employees in the undertaking's own workforce"
    concept: nonemployee-characteristics
    datenpunkte:
      - {verweis: "S1-7 ¶55", datentyp: quantitativ, text: "Gesamtzahl der Nicht-Beschäftigten in der eigenen Belegschaft (z. B. Leiharbeit, Selbstständige)."}
  - dr_code: S1-8
    dr_name: "Collective bargaining coverage and social dialogue"
    concept: collective-bargaining
    datenpunkte:
      - {verweis: "S1-8 ¶60", datentyp: quantitativ, text: "Anteil der Beschäftigten, der durch Tarifverträge abgedeckt ist (EWR und außerhalb)."}
      - {verweis: "S1-8 ¶63", datentyp: quantitativ, text: "Anteil der Beschäftigten im EWR, der durch Arbeitnehmervertretungen im Rahmen des sozialen Dialogs vertreten wird."}
  - dr_code: S1-9
    dr_name: "Diversity metrics"
    concept: diversity
    datenpunkte:
      - {verweis: "S1-9 ¶66", datentyp: quantitativ, text: "Geschlechterverteilung in der obersten Führungsebene und Altersverteilung der Beschäftigten."}
  - dr_code: S1-10
    dr_name: "Adequate wages"
    concept: adequate-wages
    datenpunkte:
      - {verweis: "S1-10 ¶69", datentyp: quantitativ, text: "Angabe, ob alle Beschäftigten eine angemessene Entlohnung (existenzsichernder Lohn) erhalten, ggf. Anteil unterhalb des Schwellenwerts."}
  - dr_code: S1-11
    dr_name: "Social protection"
    concept: social-protection
    datenpunkte:
      - {verweis: "S1-11 ¶74", datentyp: narrativ, text: "Angabe, ob die Beschäftigten gegen Einkommensverlust durch Krankheit, Arbeitslosigkeit, Arbeitsunfall, Elternschaft und Ruhestand sozial abgesichert sind."}
  - dr_code: S1-12
    dr_name: "Persons with disabilities"
    concept: persons-disabilities
    datenpunkte:
      - {verweis: "S1-12 ¶79", datentyp: quantitativ, text: "Anteil der Beschäftigten mit Behinderung, vorbehaltlich gesetzlicher Einschränkungen der Datenerhebung."}
  - dr_code: S1-13
    dr_name: "Training and skills development metrics"
    concept: training-development
    datenpunkte:
      - {verweis: "S1-13 ¶83", datentyp: quantitativ, text: "Anteil der Beschäftigten mit regelmäßiger Leistungs- und Laufbahnbeurteilung sowie durchschnittliche Schulungsstunden je Beschäftigtem (nach Geschlecht)."}
  - dr_code: S1-14
    dr_name: "Health and safety metrics"
    concept: health-safety
    datenpunkte:
      - {verweis: "S1-14 ¶88", datentyp: quantitativ, text: "Anteil der durch das Gesundheits- und Sicherheitsmanagementsystem abgedeckten Beschäftigten sowie Zahl und Rate arbeitsbedingter Unfälle."}
      - {verweis: "S1-14 ¶88(c)", datentyp: quantitativ, text: "Zahl der Todesfälle infolge arbeitsbedingter Verletzungen und Erkrankungen."}
  - dr_code: S1-15
    dr_name: "Work-life balance metrics"
    concept: work-life-balance
    datenpunkte:
      - {verweis: "S1-15 ¶93", datentyp: quantitativ, text: "Anteil der Beschäftigten mit Anspruch auf familienbedingte Freistellung und Anteil, der diese in Anspruch genommen hat (nach Geschlecht)."}
  - dr_code: S1-16
    dr_name: "Remuneration metrics (pay gap and total remuneration)"
    concept: remuneration
    datenpunkte:
      - {verweis: "S1-16 ¶97(a)", datentyp: quantitativ, text: "Geschlechtsspezifisches Verdienstgefälle (unbereinigter Gender Pay Gap)."}
      - {verweis: "S1-16 ¶97(b)", datentyp: quantitativ, text: "Verhältnis der Jahresvergütung der höchstbezahlten Person zum Median der übrigen Beschäftigten."}
  - dr_code: S1-17
    dr_name: "Incidents, complaints and severe human rights impacts"
    concept: incidents
    datenpunkte:
      - {verweis: "S1-17 ¶103", datentyp: quantitativ, text: "Zahl der Diskriminierungs- und Belästigungsvorfälle, eingegangene Beschwerden und verhängte Sanktionen/Bußgelder."}
      - {verweis: "S1-17 ¶104", datentyp: quantitativ, text: "Zahl schwerwiegender Menschenrechtsvorfälle im Zusammenhang mit der eigenen Belegschaft sowie damit verbundene Bußgelder/Entschädigungen."}
