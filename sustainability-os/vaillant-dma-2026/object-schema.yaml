# Objekt-Schema — Knowledge Layer des Sustainability OS (kanonisch)
# Definiert: Pflicht-Metadaten, Objekt-Typen, das erlaubte Beziehungs-Vokabular
# und die Integritätsregeln. `tools/validate.py` liest genau diese Datei.
#
# Warum das existiert: Sobald Beziehungen GETYPT sind, wird Schema + referenzielle
# Integrität tragend (Grundproblem E). Ohne diese Datei ist der Objektgraph nur
# eine hübsche Idee — mit ihr ist er prüfbar.

# --- Metadaten-Kopf, den JEDES Objekt tragen muss (Synthese-Prinzip 2) ---
metadata_pflicht: [id, type, owner, status, stand, vertraulichkeit]
metadata_optional: [review_zyklus, esrs_bezug, quelle]

vertraulichkeit_stufen: [oeffentlich, intern, vertraulich, streng-vertraulich]

# `owner` ist ein Metadatenfeld und MUSS auf eine existierende person-id zeigen.
# (Die Owner-Kante wird damit nicht doppelt modelliert — owner IST die Kante.)

# --- Objekt-Typen + typ-spezifische Pflichtfelder + erlaubte Beziehungen ---
objekt_typen:
  topic:
    pflichtfelder: []
    beziehungen: [has_target, has_kpi, has_initiative, has_iro]
  target:
    pflichtfelder: [baseline_wert, baseline_jahr, zielwert, zieljahr, einheit, geltungsbereich]
    beziehungen: [measured_by, supported_by, approved_by, at_risk_from, addresses]
  kpi:
    pflichtfelder: [einheit]
    beziehungen: [sourced_from, at_risk_from]
  initiative:
    pflichtfelder: []
    beziehungen: [has_budget, supports, uses_factor, depends_on]
  strategy:                     # thematische Strategie / Transitionsplan
    pflichtfelder: []
    beziehungen: [concerns, addresses]
  decision:
    pflichtfelder: [datum, entscheidung]
    beziehungen: [decided_by, affects, based_on, applies, informed_by]
  budget:
    pflichtfelder: [betrag, waehrung, jahr]
    beziehungen: []
  finding:
    pflichtfelder: [datum]
    beziehungen: [affects]
  person:
    pflichtfelder: []
    beziehungen: []
  # --- DMA-Slice: Wesentlichkeitsanalyse ---
  iro:                          # Impact / Risk / Opportunity — Kernobjekt der DMA
    pflichtfelder: [iro_typ, impact_wesentlichkeit, finanz_wesentlichkeit, wesentlich]
    beziehungen: [concerns, informed_by, scored_under]
  stakeholder:                  # interne/externe Partei, deren Input einfließt
    pflichtfelder: [stakeholder_typ]
    beziehungen: []             # owner = interne:r Beziehungs-Verantwortliche:r (person)
  methodology:                  # Governance: wie wurde bewertet (Begründungs-Layer, #3)
    pflichtfelder: []
    beziehungen: []
  threshold:                    # Governance: ab wann gilt etwas als wesentlich
    pflichtfelder: []
    beziehungen: []
  # --- Disclosure-Slice: Offenlegung & Assurance ---
  datapoint:                    # ESRS-Offenlegungs-Anforderung (die Pflicht)
    pflichtfelder: [esrs_datapoint]
    beziehungen: [concerns]
  disclosure:                   # versionierter Berichtstext, der die Pflicht erfüllt (#19)
    pflichtfelder: [esrs_datapoint, berichtsjahr, version]
    beziehungen: [discloses, reports]
  evidence:                     # Nachweis/Prüfspur hinter einer Offenlegung (#17)
    pflichtfelder: []
    beziehungen: [backs, sourced_from]
  control:                      # Kontrolle, die einen Datenpunkt absichert (#17)
    pflichtfelder: []
    beziehungen: [covers]
  audit-finding:                # Auditor-Beanstandung (#18)
    pflichtfelder: [datum]
    beziehungen: [challenges]
  # --- Migrierte Registries (ex targets.yaml / glossary.md / EF-Katalog) ---
  term:                         # kanonische Definition (ex glossary.md)
    pflichtfelder: [begriff]
    beziehungen: []
  emission-factor:              # Emissionsfaktor (ex emission-factors-catalog.yaml)
    pflichtfelder: [einheit, wert]
    beziehungen: []
  policy:                       # ESRS-Policy je wesentlichem Thema (#16)
    pflichtfelder: []
    beziehungen: [concerns, addresses]
  annual-plan:                  # Jahres-Planungs-Layer (#12/#14)
    pflichtfelder: [jahr]
    beziehungen: [plans]
  dependency:                   # Abhängigkeit von natürl./sozialem Kapital (DMA Sheet 2)
    pflichtfelder: []
    beziehungen: []

# --- Beziehungs-Vokabular: erlaubte Kante -> erlaubte Ziel-Typen ---
# Eine Kante, die hier nicht steht, ist verboten. Eine Kante auf einen
# falschen Ziel-Typ (z. B. has_target -> person) ist ein Integritätsfehler.
beziehungs_vokabular:
  has_target:   [target]
  has_kpi:      [kpi]
  has_initiative: [initiative]
  measured_by:  [kpi]
  supported_by: [initiative]
  approved_by:  [decision]
  decided_by:   [person]
  supports:     [target]
  affects:      [target, kpi, topic]
  at_risk_from: [finding]
  has_budget:   [budget]
  uses_factor:  [emission-factor]
  # --- DMA-Slice ---
  has_iro:      [iro]
  plans:        [initiative]
  addresses:    [iro]
  depends_on:   [dependency]
  concerns:     [topic]
  informed_by:  [stakeholder]
  scored_under: [methodology]
  based_on:     [methodology]
  applies:      [threshold]
  # --- Disclosure-Slice ---
  discloses:    [datapoint]
  reports:      [kpi]
  backs:        [disclosure]
  covers:       [datapoint]
  challenges:   [disclosure]
  # sourced_from darf auf eine EXTERNE Datei im Repo zeigen (kein Objekt),
  # z. B. das Inventar. validate.py prüft hier nur: Pfad existiert.
  sourced_from: [_extern_]

# --- Integritätsregeln (von validate.py durchgesetzt) ---
integritaets_regeln:
  - "Jedes Objekt trägt alle metadata_pflicht-Felder."
  - "owner zeigt auf eine existierende person-id."
  - "Jede Beziehungs-id zeigt auf ein existierendes Objekt erlaubten Typs."
  - "type=target: zieljahr > baseline_jahr; baseline_wert & zielwert numerisch."
  - "vertraulichkeit ist eine der vertraulichkeit_stufen."
  - "review_zyklus (falls gesetzt) im ISO-8601-Format P<n>M."
