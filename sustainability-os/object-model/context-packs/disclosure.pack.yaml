# Context Pack: Disclosure / Assurance
# ============================================================================
# Aufgabe: Einen ESRS-Datenpunkt prüfsicher offenlegen (Berichtstext finalisieren).
# Schließt die zuvor unmodellierten Lücken #17 (Nachweise/Kontrollen), #18
# (Audit-Feedback) und #19 (versionierter Berichtstext).
# ============================================================================

pack: disclosure
zweck: >
  Minimaler, aber prüfsicherer Kontext, um einen Datenpunkt offenzulegen —
  inklusive aller Gründe, warum er (noch) nicht final werden darf.

parameter:
  datapoint_id: datapoint-e1-6-brutto-thg

# --- WAS REIN MUSS ---
include:
  - object: "{datapoint_id}"
  - traverse: "{datapoint_id} -> concerns -> topic"               # thematischer Bezug
  - find: "disclosure WHERE discloses == {datapoint_id} UND berichtsjahr == aktuell"
  - traverse: "disclosure -> reports -> kpi"                       # die berichtete Zahl
  - find: "evidence WHERE backs == disclosure"                    # Prüfspur (#17)
  - find: "control WHERE covers == {datapoint_id}"                # Kontrolle (#17)

# --- WAS DRAUSSEN BLEIBT ---
exclude:
  - type: target          # zukunftsgerichtet, gehört nicht in die Ist-Offenlegung
  - type: budget
  - external: Strategie-Narrativ / Roadmap
  - external: DMA-Workshop-Notizen
  - external: Umsetzungspläne, Lieferantenverträge

# --- ESKALATIONS-KLAUSEL: "nichts veröffentlichen, was du nicht beweisen kannst" ---
# Bei der Offenlegung ist der teure Fehler eine final gesetzte Zahl, die nicht hält.
# Der Pack ist daher ein GATE: er liefert jeden Grund mit, der "final" blockiert.
eskalation_immer_einschliessen:
  - traverse: "disclosure -> reports -> kpi -> at_risk_from -> finding WHERE status != geschlossen"
  - find: "audit-finding WHERE challenges == disclosure UND status != geschlossen"
  - gate_regel: >
      Eine disclosure darf status 'final'/'assured' NICHT erreichen, solange (a) eine
      offene Datenqualitäts-Finding den berichteten KPI berührt ODER (b) ein offenes
      Audit-Finding sie beanstandet. Beides wird immer mitgeliefert — auch wenn der
      Konsument nur „den Text" wollte.

# --- ACCESS-CONTROL ---
# Für den externen Wirtschaftsprüfer als Konsument: er sieht Datenpunkt, Disclosure-Text,
# Evidence, Control, Audit-Findings — aber keine vertraulichen Budgets/Strategie-Interna.
vertraulichkeit_filter: "<= freigabe_des_konsumenten"

# --- ERWARTETES ERGEBNIS für datapoint-e1-6-brutto-thg ---
# Eingeschlossen:  datapoint-e1-6, topic-e1-klima, disclosure-e1-6-2025 (v0.3-entwurf),
#                  kpi-scope3-intensitaet, evidence-inventar-2025, control-thg-bilanzierung
# Per Eskalation:  finding-2026-05-12-spend-based-overcount (über kpi)  +
#                  audit-finding-2026-baseline-konsistenz (challenges disclosure)
# Gate-Ergebnis:   status bleibt 'entwurf' — beide Blocker offen.
