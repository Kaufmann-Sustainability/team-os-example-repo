# View: My Work   (zur Abgrenzung View ≠ Context Pack)
# ============================================================================
# Eine VIEW ist *wer schaut* — eine stehende, rollen-/personenbasierte Perspektive.
# Ein CONTEXT PACK ist *welche Aufgabe* — ein transientes, durch Ausschluss
# definiertes Minimal-Bündel für einen Task/Agenten.
# Beide sind nur Sichten auf dieselben Objekte (keine Kopien) — aber sie zu
# vermischen, baut die Duplizierung von Grundproblem A wieder ein.
# ============================================================================

view: my-work
typ: persistente-personen-perspektive   # NICHT aufgabengebunden
parameter:
  person_id: person-jonasfischer

zeigt:
  - "alle Objekte WHERE owner == {person_id}"
  - gruppiert_nach: type
  - markiere: "Objekte WHERE stand + review_zyklus < heute  → überfällig"
  - markiere: "Objekte mit offener at_risk_from-Kante       → Risiko"

beantwortet:
  - "Wofür bin ich verantwortlich?"
  - "Was ist überfällig?"
  - "Was braucht meine Aufmerksamkeit?"

# Ergebnis für person-jonasfischer in diesem Slice:
#   target      : target-sbti-scope3-2030            (⚠ Risiko: offene Finding)
#   initiative  : initiative-scope3-supplier-engagement
