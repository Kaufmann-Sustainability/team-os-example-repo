# Nordmark — Emissionsfaktoren-Katalog
# Registry aller verwendeten Emissionsfaktoren (EF).
# Pendant zur data-catalog.yaml im Forge-Beispiel.
# Anker (z. B. &strom-de-market-based) werden aus initiative-index.yaml und Briefs referenziert.

faktoren:
  - id: strom-de-market-based
    name: Strom Deutschland (market-based)
    scope: 2
    einheit: kgCO2e/kWh
    wert: 0.000          # nach PPA-Umstellung; Residualmix-Faktor bei Graustrom-Anteil
    wert_vor_ppa: 0.380
    quelle: Versorger-Herkunftsnachweis / Residualmix-Faktor (UBA)
    gueltig_ab: 2026
    owner: Sophie Wagner
    bezug: programs/briefs/renewable-electricity-ppa/renewable-electricity-ppa-brief.md

  - id: strom-de-location-based
    name: Strom Deutschland (location-based)
    scope: 2
    einheit: kgCO2e/kWh
    wert: 0.366
    quelle: UBA Strommix DE
    gueltig_ab: 2025
    owner: Sophie Wagner

  - id: erdgas-prozesswaerme
    name: Erdgas (Verbrennung Prozesswärme)
    scope: 1
    einheit: kgCO2e/kWh
    wert: 0.201
    quelle: DEFRA / GEMIS
    gueltig_ab: 2025
    owner: Tobias Klein

  - id: stahl-spend-based
    name: Stahl (spend-based, generisch)
    scope: 3
    kategorie: 1
    einheit: kgCO2e/EUR
    wert: 0.45
    quelle: EXIOBASE / Branchen-Durchschnitt
    methodik: spend-based
    datenqualitaet: niedrig
    hinweis: Übergangslösung — wird durch supplier-specific ersetzt. Doppelzählungs-Risiko siehe data-quality-finding 2026-05-12.
    gueltig_ab: 2025
    owner: Tobias Klein

  - id: stahl-supplier-specific
    name: Stahl (ACME, lieferanten-spezifisch)
    scope: 3
    kategorie: 1
    einheit: kgCO2e/t Stahl
    wert: 2150           # Hochofen-Route; Green-Steel-Variante in Prüfung
    wert_green_steel: 650
    quelle: ACME Stahl Primärdaten (Fragebogen Q4 2026)
    methodik: supplier-specific
    datenqualitaet: hoch
    gueltig_ab: 2027
    owner: Jonas Fischer
    bezug: programs/stakeholders/accounts/lieferant-acme-stahl/CLAUDE.md

  - id: aluminium-spend-based
    name: Aluminium (spend-based, generisch)
    scope: 3
    kategorie: 1
    einheit: kgCO2e/EUR
    wert: 0.62
    quelle: EXIOBASE / Branchen-Durchschnitt
    methodik: spend-based
    datenqualitaet: niedrig
    gueltig_ab: 2025
    owner: Tobias Klein

  - id: diesel-fuhrpark
    name: Diesel (Fuhrpark)
    scope: 1
    einheit: kgCO2e/Liter
    wert: 2.68
    quelle: DEFRA
    gueltig_ab: 2025
    owner: Tobias Klein
