# View: DMA   (stehende Perspektive für den Reporting-/Assurance-Blick)
# ============================================================================
# View = wer schaut (hier: ESG-Reporting Lead / Wirtschaftsprüfer, dauerhaft).
# Context Pack = welche Aufgabe (ein einzelnes Wesentlichkeitsurteil fällen).
# Dieselben Objekte, andere Brille.
# ============================================================================

view: dma
typ: persistente-rollen-perspektive
fuer: [person-markusbauer, stakeholder-wirtschaftspruefer-assurance]

zeigt:
  - "alle topic-Objekte"
  - spalten: [esrs_bezug, status (wesentlich?), iro.impact_wesentlichkeit, iro.finanz_wesentlichkeit]
  - "je topic: verlinktes IRO, Methodik, Schwellwert, Entscheidung"
  - markiere: "topic WHERE status == nicht-wesentlich UND iro hat widersprechenden Stakeholder-Input  → Ausschluss prüfen"
  - markiere: "topic WHERE status == wesentlich UND kein has_target  → wesentlich aber hohl"

beantwortet:
  - "Welche Themen sind wesentlich — und warum?"
  - "Welche Ausschlüsse muss ich gegenüber Assurance verteidigen?"
  - "Wo widerspricht ein Stakeholder dem Urteil?"

# Ergebnis in diesem Slice:
#   topic-e1-klima   : wesentlich (hoch/hoch)
#   topic-e2-umwelt  : wesentlich (mittel/mittel)  ⚠ hohl — kein has_target
#   topic-e3-wasser  : nicht wesentlich (niedrig/niedrig)  ⚠ Investoren-Dissens → prüfen
