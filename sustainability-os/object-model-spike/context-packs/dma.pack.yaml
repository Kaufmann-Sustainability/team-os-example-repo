# Context Pack: DMA (Doppelte Wesentlichkeitsanalyse)
# ============================================================================
# Aufgabe: Wesentlichkeit eines Themas bestimmen oder überprüfen.
# Härtere Probe als Target-Setting: viel Narrativ (Begründungen), mehr Objekt-
# Typen (IRO, Stakeholder, Methodik, Schwellwert) — und ein eigener Eskalations-
# Fall: das "nicht wesentlich"-Urteil.
# ============================================================================

pack: dma
zweck: >
  Minimaler, aber prüfsicherer Kontext, um ein Wesentlichkeitsurteil zu fällen
  oder zu verteidigen.

parameter:
  topic_id: topic-e3-wasser        # Beispiel: der heikle Ausschluss-Fall

# --- WAS REIN MUSS ---
include:
  - object: "{topic_id}"
  - traverse: "{topic_id} -> has_iro -> iro"                 # Impact-/Finanz-Scores
  - traverse: "iro -> informed_by -> stakeholder"            # wer hat Input geliefert
  - traverse: "iro -> scored_under -> methodology"           # nach welcher Methode
  - ref_decision: "decision WHERE affects enthält {topic_id}" # prior decision (Ergebnis)
  - traverse: "decision -> applies -> threshold"             # die Entscheidungsregel

# --- WAS DRAUSSEN BLEIBT (macht "minimal" minimal) ---
exclude:
  - type: budget
  - type: target / kpi          # operative Steuerung gehört nicht in die Wesentlichkeit
  - external: Audit-Evidence / Controls
  - external: Lieferantenverträge
  - external: Umsetzungspläne (implementation/plans)

# --- ESKALATIONS-KLAUSEL (DMA-spezifisch) ---
# Der teure Fehler bei der DMA ist nicht "zu viel", sondern ein STILLSCHWEIGENDER
# AUSSCHLUSS, den niemand mehr hinterfragt. Deshalb:
eskalation_immer_einschliessen:
  - regel_nicht_wesentlich: >
      Ist das Thema 'nicht-wesentlich', liefere IMMER sein IRO + die Begründung mit —
      ein Ausschluss ohne abrufbare Begründung ist gegenüber Assurance nicht haltbar.
  - regel_dissens: >
      Liefere IMMER jeden Stakeholder-Input mit, der dem Urteil WIDERSPRICHT
      (z. B. Investoren markieren Wasser als Risiko, obwohl 'nicht wesentlich').
      So veraltet ein Ausschluss nicht im Stillen.
  - traverse: "{topic_id} -> has_iro -> iro WHERE wesentlich == nein -> informed_by -> stakeholder"

# --- ACCESS-CONTROL ÜBER DEN PACK (Grundproblem D) ---
# Für den externen Wirtschaftsprüfer als Konsument: vertrauliche Objekte (z. B.
# Budgets) fallen automatisch weg — er sieht Methodik, Schwellwert, IROs, Begründungen.
vertraulichkeit_filter: "<= freigabe_des_konsumenten"

# --- ERWARTETES ERGEBNIS für topic-e3-wasser ---
# Eingeschlossen:  topic-e3-wasser, iro-e3-wasser (niedrig/niedrig, nicht wesentlich),
#                  methodology-dma-2026, threshold-wesentlichkeit-2026, decision-dma-2026
# Per Eskalation:  stakeholder-investoren-hausbanken (Wasser-Dissens) + die Begründung
# Ausgeschlossen:  Budgets, Targets/KPIs, Audit-Evidence, Lieferantenverträge
