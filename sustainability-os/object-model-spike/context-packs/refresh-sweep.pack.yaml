# Context Pack: Refresh-Sweep  (Pflege als Feature, nicht als Disziplin)
# ============================================================================
# Beantwortet die Frage: "Kann man Loops nutzen, um monatlich/quartalsweise
# abzufragen, ob es z. B. neue Klima-Maßnahmen gab?" — Ja. Aber nicht als
# in-session /loop (Container wird recycelt), sondern als GEPLANTER TRIGGER
# (siehe ../triggers/quarterly-refresh.md), der diesen Pack ausführt.
#
# Das verwandelt das Adoptions-Risiko ("jemand muss dran denken, die Objekte
# aktuell zu halten") in ein proaktives System, das die Owner anpingt.
# Möglich wird das, WEIL jedes Objekt `stand` + `review_zyklus` + `owner` trägt
# (Grundproblem D / Finding #6: Frische wird abfragbar).
# ============================================================================

pack: refresh-sweep
zweck: Veraltete oder unvollständige Objekte finden und ihre Owner gezielt anstoßen.
ausgeloest_durch: ../triggers/quarterly-refresh.md

# --- Die Sweep-Abfragen (jede liefert eine Liste „Objekt + Owner + Grund") ---
abfragen:
  - name: ueberfaellig
    query: "alle Objekte WHERE stand + review_zyklus < heute"
    frage_an_owner: "Dein Objekt {id} ist seit {faellig_seit} überfällig — noch aktuell?"

  - name: ziel_haengt_fest
    query: "target WHERE status == 'eingereicht-zur-validierung' UND stand älter als 90 Tage"
    frage_an_owner: "Ziel {id} wartet seit >90 Tagen auf Validierung — Stand?"

  - name: kpi_nicht_aktualisiert
    query: "kpi WHERE status == 'vorlaeufig' ODER aktueller_wert.jahr < berichtsjahr"
    frage_an_owner: "KPI {id} hat noch keinen finalen {berichtsjahr}-Wert — nachtragen?"

  - name: initiative_ohne_neue_aktivitaet
    query: "initiative WHERE keine neue Aktivität seit > 1 Quartal"
    frage_an_owner: "Gab es seit letztem Quartal neue Maßnahmen für {id}, die hier fehlen?"

  - name: offenes_risiko_vor_reporting
    query: "finding WHERE status != geschlossen UND affects ein offenlegungsrelevantes Objekt"
    frage_an_owner: "Finding {id} ist offen und berührt {esrs_bezug} — Korrektur-Stand vor Offenlegung?"

# --- Ausgabe / Zustellung ---
ausgabe:
  format: "pro Fund: {objekt}, {owner}, {fehlender_oder_veralteter_aspekt}, {rueckfrage}"
  zustellung:
    - kanal: "#klima-alerts (Slack)"          # vgl. CLAUDE.md: Kanal für automatische Alerts
    - direkt: "DM an {owner.slack}"
  eskalation: "Bleibt eine Rückfrage 2 Sweeps unbeantwortet → an Themen-Owner (CSO)."

# --- Was dieser Sweep für diesen Slice HEUTE fände (2026-06-09) ---
# - kpi_nicht_aktualisiert  -> kpi-scope3-intensitaet (status: vorlaeufig)        -> Sophie Wagner
